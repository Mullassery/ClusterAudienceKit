# ClusterAudienceKit MCP 2.0 Configuration
# Enable AI-native customer segmentation and audience intelligence

[mcp]
enabled = true
port = 8768
discovery_method = "stdio"

[mcp.tools]
segment_customers = true
get_segment_profiles = true
export_segments_sql = true
sync_to_platform = true
detect_segment_drift = true
estimate_auto_k = true
calculate_customer_lifetime_value = true
predict_churn = true
generate_lookalike_audience = true
cohort_analysis = true
get_segment_quality = true

[mcp.security]
require_auth = false
allowed_models = []

[mcp.performance]
cache_results = true
cache_ttl_seconds = 3600
