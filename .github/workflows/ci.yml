name: Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Single-crate repo (one root Cargo.toml, no [workspace] members),
          # so the workspace root is ".". A prior config referenced
          # "crates"/"core"/"python" dirs that don't exist here, which
          # Swatinem/rust-cache silently no-ops on instead of failing.
          workspaces: .

      - name: Build Rust
        run: cargo build --release --all-features

      - name: Test Rust
        run: cargo test --release --all-features

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: if [ -d "tests" ]; then pytest tests/ -v --tb=short; else echo "No Python tests found"; fi

  security-audit:
    # New job (2026-09-20 OSS-standardization pass). Not previously present
    # anywhere in this repo's CI. Could not be verified from the sandbox
    # this was added in (`cargo audit`'s advisory-db fetch over git needs
    # outbound network access this sandbox didn't have), but GitHub-hosted
    # runners have full internet access, so this should run for real here.
    # See docs/ROADMAP_HONEST.md.
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
