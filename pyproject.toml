[build-system]
requires = ["maturin>=1.0,<2.0", "numpy"]
build-backend = "maturin"

[project]
name = "clusteraudiencekit"
version = "7.1.1"
description = "Rust-powered customer segmentation: RFM analysis, KMeans/K-Prototypes clustering, churn prediction, customer lifetime value, real-time streaming segmentation, drift detection, lookalike audiences, cohort analytics, lifecycle tracking, and differential privacy / k-anonymity."
readme = "README.md"

authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
maintainers = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
requires-python = ">=3.8"
keywords = [
    "clustering",
    "customer-segmentation",
    "rfm-analysis",
    "martech",
    "audience-segmentation",
    "customer-analytics",
    "machine-learning",
    "k-means",
    "k-prototypes",
    "differential-privacy",
    "k-anonymity",
    "segmentation-engine",
    "crm",
    "customer-lifetime-value",
    "churn-prediction",
    "cohort-analysis",
    "audience-targeting",
    "marketing-automation",
    "email-marketing",
    "retargeting",
    "customer-scoring",
    "behavioral-analytics",
    "data-science",
    "python-library",
    "real-time-processing",
    "streaming-data",
    "marketing-tech",
    "audience-modeling",
    "rust-performance",
    "predictive-analytics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: News/Diary",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24,<2.1",
    "pyarrow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "black>=22.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/Mullassery/ClusterAudienceKit"
Repository = "https://github.com/Mullassery/ClusterAudienceKit"
Documentation = "https://github.com/Mullassery/ClusterAudienceKit#readme"
"Bug Tracker" = "https://github.com/Mullassery/ClusterAudienceKit/issues"
Changelog = "https://github.com/Mullassery/ClusterAudienceKit/releases"
"Source Code" = "https://github.com/Mullassery/ClusterAudienceKit/tree/main"
Discussions = "https://github.com/Mullassery/ClusterAudienceKit/discussions"

[tool.maturin]
features = ["pyo3/extension-module"]
python-packages = ["clusteraudiencekit"]
