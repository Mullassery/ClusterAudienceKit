name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # [project.optional-dependencies].dev is always defined in
        # pyproject.toml, so the old `2>/dev/null || pip install -e .`
        # fallback was dead code that just hid real install failures behind
        # a swallowed stderr.
        run: pip install -e ".[dev]"
      - name: Test
        # `pytest 2>/dev/null || echo "No tests"` previously meant this step
        # reported success unconditionally, regardless of whether pytest
        # actually ran, crashed, or genuinely failed - a real failure would
        # have been silently swallowed rather than turning CI red.
        run: pytest
      - name: Lint
        # Previously `ruff check . 2>/dev/null || true`, which discarded
        # ruff's stderr AND always exited 0 - silently hiding findings
        # entirely, the same "always green" anti-pattern already fixed once
        # in the Test step above. Then briefly `continue-on-error: true`
        # (2026-09-20) because `ruff check .` had 33 real, pre-existing
        # findings and a hard gate would've turned CI red on unrelated debt.
        # Those 33 findings were fixed for real in the 2026-09-21 quick-fix
        # pass (see docs/ROADMAP_HONEST.md) - `ruff check .` is clean now,
        # so this is a real, blocking gate again.
        run: ruff check .
